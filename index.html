<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Последний поезд</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=PT+Mono&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #14110d;
      --panel: #1f1a14;
      --line: #3a3026;
      --text: #e8dcc6;
      --muted: #9a8b74;
      --accent: #d9a441;
      --red: #c8473a;
      --green: #7fa65a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: "PT Sans", system-ui, sans-serif;
      font-size: 17px; line-height: 1.5;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #2a2118 0%, transparent 60%),
        var(--bg);
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
    [hidden] { display: none !important; }

    /* Картинки */
    .art {
      width: 100%; aspect-ratio: 2 / 1; border-radius: 12px; overflow: hidden;
      border: 1px solid var(--line); background: #0d0b08; margin-bottom: 14px;
    }
    .art svg { display: block; width: 100%; height: 100%; }
    .fade { animation: fade .6s ease; }
    @keyframes fade { from { opacity: 0; } }
    .shake { animation: shake .35s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); box-shadow: none; }
      25% { transform: translateX(-6px); box-shadow: 0 0 0 2px var(--red); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }
    .center { text-align: center; }

    /* Глава 2: припасы и шкала «Новый дом» */
    #ch2-stats { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 6px; }
    #ch2-stats .low { color: var(--red); font-weight: 700; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .5; } }
    .goal-row { color: var(--accent); }
    .goals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .goal {
      text-align: center; padding: 3px 0; border-radius: 6px; font-size: 15px;
      background: #000; border: 1px solid var(--line); filter: grayscale(1); opacity: .45;
    }
    .goal.done { background: rgba(217,164,65,.25); border-color: var(--accent); filter: none; opacity: 1; }
    #enemy-warn {
      margin-top: 8px; padding: 6px 8px; border-radius: 6px; font-size: 14px; font-weight: 700;
      background: rgba(200,71,58,.25); color: #ffb3a8; animation: blink 1s infinite;
    }
    .soon {
      border: 1px dashed var(--accent); border-radius: 10px; padding: 12px 14px;
      background: rgba(217,164,65,.08); display: grid; gap: 6px;
    }
    .soon b { color: var(--accent); font-family: "PT Mono", monospace; }

    /* Меню */
    #menu { text-align: center; padding-top: 4vh; }
    #menu-art { margin-bottom: 18px; }
    #menu-endings, #loading { color: var(--muted); font-size: 14px; margin-top: 14px; }
    #menu-snd { background: transparent; border: 0; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; margin-top: 8px; }
    #menu h1 {
      font-family: "PT Mono", monospace; letter-spacing: 3px; text-transform: uppercase;
      color: var(--accent); margin: 8px 0 4px; font-size: 28px;
    }
    #menu p { color: var(--muted); margin: 0 0 32px; }

    /* Панель героя */
    .stats {
      position: sticky; top: 0; z-index: 5;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 12px; margin-bottom: 14px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px;
      font-family: "PT Mono", monospace; font-size: 13px;
    }
    .bar { height: 6px; background: #000; border-radius: 3px; overflow: hidden; margin-top: 3px; }
    .bar > div { height: 100%; transition: width .3s; }
    #hp-fill, #enemy-fill { background: var(--red); }
    #xp-fill { background: var(--accent); }
    .stats .row { display: flex; justify-content: space-between; }
    .chips { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; }
    .chips span { white-space: nowrap; }
    #inv-btn, #snd-btn {
      background: transparent; color: var(--text);
      border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px;
      font: inherit; cursor: pointer;
    }
    #inv-btn { margin-left: auto; }
    .chips { flex-wrap: wrap; }

    /* Сцена */
    #title {
      font-family: "PT Mono", monospace; color: var(--accent);
      text-transform: uppercase; letter-spacing: 1px; font-size: 20px; margin: 4px 0 10px;
    }
    #text { white-space: pre-line; margin-bottom: 16px; }
    #notes .note {
      background: rgba(217,164,65,.1); border-left: 3px solid var(--accent);
      padding: 6px 10px; margin-bottom: 6px; border-radius: 4px; font-size: 15px;
      animation: pop .3s ease;
    }
    #notes { margin-bottom: 10px; }
    @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }

    /* Враг */
    #enemy {
      background: rgba(200,71,58,.08); border: 1px solid rgba(200,71,58,.4);
      border-radius: 12px; padding: 10px 12px; margin-bottom: 14px;
    }
    #enemy .row { display: flex; justify-content: space-between; font-weight: 700; }
    #fight-log { font-family: "PT Mono", monospace; font-size: 14px; margin-top: 8px; color: var(--muted); }
    #fight-log div:first-child { color: var(--text); }

    /* Кнопки */
    #choices { display: flex; flex-direction: column; gap: 10px; padding-bottom: 24px; }
    .choice {
      width: 100%; text-align: left; font: inherit; color: var(--text);
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 13px 14px; cursor: pointer; transition: border-color .15s, transform .05s;
    }
    .choice:hover { border-color: var(--accent); }
    .choice:active { transform: scale(.98); }
    .choice:disabled { opacity: .4; cursor: not-allowed; }
    .choice.attack { background: var(--accent); color: #1a140c; border-color: var(--accent); font-weight: 700; text-align: center; }
    .choice.ghost { background: transparent; color: var(--muted); }
    #menu .choice { text-align: center; margin-bottom: 10px; }

    .ending {
      text-align: center; font-family: "PT Mono", monospace; font-size: 18px;
      padding: 14px; border-radius: 10px; border: 1px solid var(--line);
    }
    .ending.good { color: var(--green); border-color: var(--green); }
    .ending.rich { color: var(--accent); border-color: var(--accent); }
    .ending.bad  { color: var(--red);   border-color: var(--red); }

    /* Инвентарь */
    #inventory {
      position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.7);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet {
      width: 100%; max-width: 560px; max-height: 80vh; overflow-y: auto;
      background: var(--panel); border-top: 1px solid var(--line);
      border-radius: 16px 16px 0 0; padding: 16px;
    }
    .sheet h2 { margin: 0 0 12px; font-family: "PT Mono", monospace; color: var(--accent); font-size: 18px; }
    .inv-item { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .inv-icon { font-size: 28px; }
    .inv-info { flex: 1; }
    .inv-name { font-weight: 700; }
    .muted { color: var(--muted); font-size: 14px; }
    .small {
      font: inherit; font-size: 14px; background: var(--accent); color: #1a140c;
      border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer;
    }
    .small:disabled { opacity: .4; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Главное меню -->
    <div id="menu">
      <div id="menu-art" class="art"></div>
      <h1>Последний поезд</h1>
      <p>Текстовая RPG о метро после конца света</p>
      <button id="continue" class="choice attack" hidden>▶️ Продолжить</button>
      <button id="chapter2" class="choice" hidden>🏠 Глава 2: Новый дом</button>
      <button id="new-game" class="choice">🆕 Новая игра</button>
      <div id="loading">Загрузка сохранения…</div>
      <div id="menu-endings"></div>
      <button id="menu-snd"></button>
    </div>

    <!-- Игра -->
    <div id="game" hidden>
      <div class="stats">
        <div>
          <div class="row"><span>❤️ Здоровье</span><span id="hp-text"></span></div>
          <div class="bar"><div id="hp-fill"></div></div>
        </div>
        <div>
          <div class="row"><span id="xp-text"></span><span>опыт</span></div>
          <div class="bar"><div id="xp-fill"></div></div>
        </div>
        <div class="chips">
          <span title="Патроны">🔸 <b id="patrons"></b></span>
          <span>⚔️ <b id="attack"></b></span>
          <span id="armor-chip" hidden>🦺 <b id="armor"></b></span>
          <span id="ally-chip" hidden>🎯 Лиса</span>
          <button id="inv-btn">🎒 <span id="inv-count"></span></button>
          <button id="snd-btn"></button>
        </div>
        <div id="ch2-stats" hidden>
          <div class="chips">
            <span title="День">📅 <b id="day"></b></span>
            <span id="flood-chip" title="Дней до затопления">🌊 <b id="flood"></b> дн.</span>
            <span id="food-chip" title="Еда">🍞 <b id="food"></b></span>
            <span id="water-chip" title="Вода">💧 <b id="water"></b></span>
            <span title="Жители">👥 <b id="people"></b></span>
          </div>
          <div class="row goal-row"><span>🏗️ Новый дом</span><span id="goal-pct"></span></div>
          <div id="goals" class="goals"></div>
        </div>
      </div>

      <div id="art" class="art"></div>
      <div id="title"></div>
      <div id="notes"></div>
      <div id="text"></div>

      <div id="enemy" hidden>
        <div class="row"><span id="enemy-name"></span><span id="enemy-hp"></span></div>
        <div class="bar"><div id="enemy-fill"></div></div>
        <div id="enemy-warn" hidden></div>
        <div id="fight-log"></div>
      </div>

      <div id="choices"></div>
    </div>
  </div>

  <!-- Инвентарь -->
  <div id="inventory" hidden>
    <div class="sheet">
      <h2>🎒 Рюкзак</h2>
      <div id="inv-list"></div>
      <button id="inv-close" class="choice" style="margin-top:14px;text-align:center">Закрыть</button>
    </div>
  </div>

  <script src="story.js"></script>
  <script src="story2.js"></script>
  <script src="art.js"></script>
  <script src="art2.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
